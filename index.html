<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="color-scheme" content="dark">
  <title>PRISM — One race. Multiple perspectives.｜競馬予想AI</title>
  <meta name="description" content="競馬予想AI「PRISM」の物語。8つのAIの視点を1つの確率にまとめる予想エンジンが、どう生まれ、何がわかったのか。触って体験する11のシーン。">
  <meta property="og:title" content="PRISM — One race. Multiple perspectives.">
  <meta property="og:description" content="競馬AIは、ここまで進化した。触って体験する、予想エンジン PRISM の物語。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://wata9857-ops.github.io/prism/assets/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/prism.css?v=5">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="hud">
    <button class="brand" id="brand" type="button" aria-label="目次を開く"><img src="assets/mark.svg" alt="" width="28" height="28"><img src="assets/wordmark.svg" alt="PRISM" width="70" height="18"></button>
    <span class="chip-ch" id="chip"></span>
    <button class="iconbtn" id="b-menu" type="button" aria-label="目次"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>

  <main id="stage"></main>
  <p class="sr" id="live" aria-live="polite"></p>
  <p class="hint" id="hint" aria-live="polite"></p>

  <nav class="bar" id="bar" aria-label="シーンの操作">
    <button class="iconbtn" id="b-prev" type="button" aria-label="前のシーン"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="prog" id="prog" role="group" aria-label="章"></div>
    <button class="iconbtn" id="b-replay" type="button" aria-label="このシーンをもう一度"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
    <button class="iconbtn" id="b-pause" type="button" aria-label="一時停止"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    <button class="nextbtn" id="b-next" type="button" aria-label="次のシーン"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>

  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-h" aria-hidden="true">
    <div class="menu-head"><h2 id="menu-h">目次</h2><button class="iconbtn" id="menu-close" type="button" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="menu-grid" id="menu-grid"></div>
    <div class="menu-foot">
      <button class="btn" type="button" id="m-restart">最初から</button>
      <label><input type="checkbox" id="m-auto"> 章の扉を自動で進める</label>
      <a class="btn" href="https://wata9857-ops.github.io/jra-ai-analytics-web/" rel="noopener">予想サイトへ ↗</a>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="grip" aria-hidden="true"></div>
    <div class="sheet-head"><h3 id="sheet-title"></h3><button class="iconbtn" id="sheet-close" type="button" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="sheet-body"></div>
  </aside>

  <noscript><p style="padding:80px 20px;text-align:center">PRISM の紹介は JavaScript を使います。予想サイトは <a href="https://wata9857-ops.github.io/jra-ai-analytics-web/">こちら</a>。</p></noscript>
  <script src="js/main.js?v=5" type="module"></script>
</body>
</html>
